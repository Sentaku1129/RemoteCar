<!DOCTYPE html>
<html>

<head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>WiFi配置</title>

    <style media="screen">
        *,
        *:before,
        *:after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080710;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* 背景动画优化 */
        .background {
            width: 100%;
            height: 100%;
            position: fixed;
            left: 0;
            top: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .background .shape {
            height: 150px;
            width: 150px;
            position: absolute;
            border-radius: 50%;
            opacity: 0.8;
        }

        .shape:first-child {
            background: linear-gradient(#1845ad, #23a2f6);
            left: -50px;
            top: -50px;
        }

        .shape:last-child {
            background: linear-gradient(to right, #ff512f, #f09819);
            right: -50px;
            bottom: -50px;
        }

        /* 平板/桌面端背景调整 */
        @media (min-width: 768px) {
            .background .shape {
                height: 250px;
                width: 250px;
            }
            .shape:first-child {
                left: calc(50% - 350px);
                top: calc(50% - 300px);
            }
            .shape:last-child {
                right: calc(50% - 350px);
                bottom: calc(50% - 300px);
            }
        }

        fieldset {
            width: 100%;
            max-width: 420px;
            background-color: rgba(255, 255, 255, 0.13);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
            padding: 30px 20px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            fieldset {
                padding: 50px 40px;
            }
        }

        fieldset * {
            color: #ffffff;
            letter-spacing: 0.5px;
            outline: none;
            border: none;
        }

        fieldset h3 {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.4;
            text-align: center;
            margin-bottom: 20px;
        }

        fieldset h4 {
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 15px;
            font-weight: 500;
            color: #e0e0e0;
        }

        /* 输入框与下拉框样式统一 */
        input, select, .custom-select {
            display: block;
            height: 48px; /* 增加高度以适应手指点击 */
            width: 100%;
            background-color: rgba(255, 255, 255, 0.07);
            border-radius: 6px;
            padding: 0 12px;
            margin-top: 8px;
            font-size: 16px; /* 防止iOS缩放 */
            font-weight: 300;
            transition: background-color 0.3s, border 0.3s;
            border: 1px solid transparent;
        }

        input:focus, select:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        input.error {
            border: 1px solid #ff6b6b;
            background-color: rgba(255, 107, 107, 0.1);
        }

        ::placeholder {
            color: #c4c4c4;
        }

        button {
            margin-top: 30px;
            width: 100%;
            background-image: linear-gradient(to right, #acb6e5, #86fde8);
            color: #080710;
            padding: 14px 0;
            font-size: 17px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* 扫描WiFi部分的布局 */
        .search_wifi {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            margin-top: 5px;
        }

        .search_wifi label {
            margin-bottom: 5px; /* 对齐 */
            margin-top: 0;
        }

        #networks {
            margin-top: 0;
            width: auto;
            min-width: 90px;
            height: 36px;
            padding: 0 15px;
            font-size: 14px;
            background-image: none;
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 2px; /* 微调对齐 */
        }
        
        #networks:active {
            background-color: rgba(255, 255, 255, 0.25);
        }

        space {
            display: block;
            height: 10px;
        }

        /* 自定义下拉框容器 */
        #dropdown {
            position: relative;
            margin-top: 8px;
        }
        
        #dropdown select {
            margin-top: 0;
            appearance: none;
            -webkit-appearance: none;
        }

        #arrow {
            color: #fff;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 12px;
        }

        select option {
            background-color: #2d2d2d;
            color: #fff;
            padding: 10px;
        }

        /* 状态提示 */
        #st {
            color: #ff6b6b;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            min-height: 24px;
            font-weight: 500;
        }

        .error-hint {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            padding-left: 2px;
        }

        #dropdown, #f2, #f3, #bk2 {
            display: none;
        }

        /* 针对超小屏幕的额外优化 */
        @media (max-width: 360px) {
            fieldset {
                padding: 20px 15px;
            }
            h3 {
                font-size: 20px;
            }
            label {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <fieldset>
        <div id="f1">
            <h3>设备WiFi配置</h3>
            
            <div class="search_wifi">
                <label for="ssid">WiFi名称</label>
                <button id="networks" type="button">搜索</button>
            </div>

            <input type="text" id="ssid" placeholder="请输入WiFi名称" required autocapitalize="off" autocorrect="off">
            
            <div id="dropdown">
                <span id="arrow">&#x25bc;</span>
                <select id="aplist" name="aplist"></select>
            </div>
            
            <space></space>

            <label for="pswd">WiFi密码</label>
            <input type="password" id="pswd" placeholder="请输入WiFi密码" required>
            
            <space></space>
            
            <label for="carname">小车名</label>
            <input type="text" id="carname" placeholder="字母/符号，最多15位" maxlength="15" required autocapitalize="off">
            <div class="error-hint" id="carname-error">只能包含字母和符号</div>

            <h4 id='st'></h4>
            <button id="submit">连接 WiFi</button>
        </div>

        <div id="f2">
            <h3>配置成功!</h3>
            <div id="i">
                <h4>WiFi已成功连接！<br /><br />请观察设备指示灯状态</h4>
            </div>
        </div>

        <div id="f3">
            <h3>连接中...</h3>
            <div style="text-align: center; margin: 20px 0;">
                <!-- 简单的加载动画 -->
                <div style="display: inline-block; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;"></div>
            </div>
            <button id="bk2">返回配置页面</button>
        </div>
    </fieldset>
    
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        var $ = function (selector) {
            return document.querySelector(selector)
        };
        var ab = $('#networks');
        var ap = $('#aplist');
        var stopAll = false, ra, rs, submitted = false;
        
        function show(f, y) {
            if (y == null)
                y = f;
            $(f).style.display = y == f ? 'block' : 'none'
        }
        
        function hide(f) {
            $(f).style.display = 'none'
        }
        
        function to(cb, x) {
            return setTimeout(cb, 1000 * x)
        }
        
        function refr() {
            if (!stopAll)
                fetch('/status', 'GET', newSt, 4)
        }
        
        function cur(f) {
            show('#f1', f);
            show('#f2', f);
            show('#f3', f)
        }
        
        // 校验逻辑保持不变
        function validateCarname(name) {
            if (!name || name.length === 0) {
                return { valid: false, message: '小车名不能为空' };
            }
            if (name.length > 15) {
                return { valid: false, message: '小车名长度不能超过15位' };
            }
            var chineseRegex = /[\u4e00-\u9fa5]/;
            if (chineseRegex.test(name)) {
                return { valid: false, message: '小车名不能包含中文字符' };
            }
            var numberRegex = /[0-9]/;
            if (numberRegex.test(name)) {
                return { valid: false, message: '小车名不能包含数字' };
            }
            var validRegex = /^[a-zA-Z!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~\s]+$/;
            if (!validRegex.test(name)) {
                return { valid: false, message: '小车名只能包含字母和符号' };
            }
            return { valid: true, message: '' };
        }
        
        $('#carname').addEventListener('input', function() {
            var carnameInput = $('#carname');
            var errorHint = $('#carname-error');
            var validation = validateCarname(this.value);
            
            if (this.value && !validation.valid) {
                carnameInput.classList.add('error');
                errorHint.style.display = 'block';
                errorHint.innerText = validation.message;
            } else {
                carnameInput.classList.remove('error');
                errorHint.style.display = 'none';
            }
        });
        
        function newSt(s, d) {
            clearTimeout(rs);
            rs = to(refr, 3);
            if (s != 200) {
                $('#st').innerText = '等待状态 (' + s + ')'
            }
            else {
                if (typeof d === 'string') d = JSON.parse(d);
                if (d == 3) {
                    st = 'Wi-Fi 连接成功!';
                    cur('#f2');
                    stopAll = true;
                    clearTimeout(ra)
                }
                else if (d == 7) {
                    st = '连接中...'
                }
                else if (d == 6) {
                    st = 'WIFI不可用或密码错误!';
                    clearTimeout(rs);
                    cur('#f1')
                }
                $('#st').innerText = st
            }
        }
        
        function submit() {
            ssid = $('#ssid').value;
            pswd = $('#pswd').value;
            carname = $('#carname').value;
            
            if (ssid == '') {
                alert('请输入WiFi名称');
                return
            }
            
            var validation = validateCarname(carname);
            if (!validation.valid) {
                alert(validation.message);
                $('#carname').focus();
                return
            }
            
            submitted = true;
            var url = '/config';
            clearTimeout(rs);
            fetch_config(url, 'POST', refr, 2);
            cur('#f3');
            rs = to(refr, 1)
        }
        
        function fetch(url, method, callback, time_out) {
            var xhr = new XMLHttpRequest();
            xhr.onloadend = function () { callback(xhr.status, xhr.responseText) };
            xhr.ontimeout = function () { callback(-1, null) };
            xhr.open(method, url, true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.timeout = (time_out || 10) * 1000;
            xhr.send()
        }
        
        function fetch_config(url, method, callback, time_out) {
            var xhr = new XMLHttpRequest();
            xhr.onloadend = function () { callback(xhr.status, xhr.responseText) };
            xhr.ontimeout = function () { callback(-1, null) };
            xhr.open(method, url, true);
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.timeout = (time_out || 10) * 1000;
            if (ssid != '')
                xhr.send(JSON.stringify({ ssid: ssid, pswd: pswd, name: carname }));
            else
                xhr.send()
        }
        
        function gotAp(s, json) {
            var list;
            if (s === 200 && json != null) {
                if (typeof json === 'string' && json.length > 0) {
                    list = JSON.parse(json)
                } else if (typeof json === 'object') {
                    list = json
                }
                list.sort(function (a, b) { return b.rssi - a.rssi });
                var ops = '<option value="" disabled selected>选择WIFI...</option>';
                for (var i = 0; i < list.length; ++i) {
                    ops += '<option value="' + list[i].ssid + '">' + list[i].ssid + '</option>'
                };
                ap.innerHTML = ops; 
                ab.disabled = false; 
                togAp(null, true); 
                ab.onclick = togAp
            } else {
                ab.innerText = '重试 (' + s + ')';
                ab.disabled = false;
            }
        }
        
        function togAp(ev, force) {
            if (!force || ap.parentNode.style.display == 'block') {
                hide('#dropdown'); show('#ssid'); ab.innerText = '扫描WiFi';
                ab.onclick = refrAp
            } else {
                show('#dropdown'); hide('#ssid'); ab.innerText = '手动输入'
            }
        }
        
        function refrAp() {
            ab.innerText = '扫描中...';
            ab.disabled = true;
            ap.innerHTML = '<option>扫描中...</option>';
            if (!stopAll)
                fetch('/scanap', 'GET', gotAp, 10)
        }
        
        window.onload = function () {
            ab.innerText = '扫描WiFi';
            ab.onclick = refrAp;
            $('#aplist').onchange = function () {
                $('#ssid').value = this.value
            };
            $('#submit').onclick = submit;
            $('#bk2').onclick = function () { cur('#f1') }
        }
    </script>
</body>
</html>
